name: Checks

on:
  push:
    branches: [main, 'feat/**', 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: streakify_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: streakify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streakify_test -d streakify_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Domain, API, PostgreSQL, types, and production build
        run: npm run check
        env:
          TEST_DATABASE_URL: postgresql://streakify_test:test-only-password@127.0.0.1:5432/streakify_test
      - run: npx playwright install --with-deps chromium
      - name: Desktop, mobile, and responsive layout checks
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
